[uwsgi]
module = wsgi:app

master = true
processes = 3
# Load the app separately in each worker after fork, instead of once in the master. Otherwise the master's
# import-time MySQL connection (table reflection) is inherited by every worker and the shared socket fails with
# "Lost connection to MySQL server during query" on each worker's first request after a start or reload.
# A plain SIGHUP reload (as deploy/deploy_backend.sh does) re-reads this file, so no systemd restart is needed.
lazy-apps = true

socket = rwcwx.sock
chmod-socket = 660
vacuum = true

die-on-term = true
